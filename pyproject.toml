[project]
name = "trading-expert"
version = "0.1.0"
description = "AI-powered trading advisor for semiconductor and tech stocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",                # DeepSeek API (OpenAI-compatible)
    "yfinance>=0.2.0",              # Stock price data
    "vaderSentiment>=3.2.1",        # Fast sentiment pre-filter (VADER)
    "sqlalchemy>=2.0.0",            # ORM for SQLite/Postgres
    "celery[redis]>=5.3.0",         # Task queue + Redis backend
    "redis>=5.0.0",                 # Redis client
    "click>=8.1.0",                 # CLI framework
    "pyyaml>=6.0",                  # YAML config parsing
    "pydantic>=2.0.0",              # Data validation + structured output
    "httpx>=0.27.0",                # Async HTTP client
    "feedparser>=6.0.0",            # RSS feed parsing
    "python-telegram-bot>=21.0.0",  # Telegram Bot API
    "python-dotenv>=1.0.0",         # .env file loading
    "alembic>=1.13.0",              # DB migrations
    "rich>=13.0.0",                 # Pretty CLI output
]

[project.scripts]
trading-agent = "trading_expert.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading_expert"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]
